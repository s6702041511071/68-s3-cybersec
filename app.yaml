services:
  s3app:
    container_name: 68-s3-app
    image: prawee/strapi
    environment:
      DATABASE_CLIENT: ${APP_DATABASE_CLIENT}
      DATABASE_HOST: ${APP_DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASS}
    env_file:
      - .env
    ports:
      - "${APP_PORT}:1337"